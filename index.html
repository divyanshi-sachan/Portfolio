<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>
    <script>
      // CRITICAL: Initialize theme BEFORE React loads - default to LIGHT mode
      (function() {
        // Force remove dark class immediately
        const html = document.documentElement;
        html.classList.remove("dark");
        html.classList.remove("light");
        
        // Check localStorage for saved preference
        const savedTheme = localStorage.getItem("theme");
        
        // ONLY add dark class if explicitly saved as "dark"
        // Otherwise, leave it empty (which means light mode in Tailwind)
        if (savedTheme === "dark") {
          html.classList.add("dark");
        } else {
          // Ensure light mode - explicitly remove dark and set light in localStorage
          html.classList.remove("dark");
          if (!savedTheme) {
            localStorage.setItem("theme", "light");
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
